name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache npm's global cache (~/.npm) keyed on package-lock.json
          cache: npm

      # package-lock.json is committed, so npm ci gives reproducible installs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # This repo is named <username>.github.io (a user site), so Pages serves
      # it from the domain root; no NEXT_PUBLIC_BASE_PATH is needed.
      # next.config.ts already defaults basePath to "".

      - name: Build
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
